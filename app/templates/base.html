<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}RepuAuto{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}">RepuAuto</a>
      <span class="navbar-text small">Tu vehículo en buenas manos</span>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <aside class="col-md-3 col-lg-2 bg-white border-end min-vh-100 p-3">
        <nav class="nav nav-pills flex-column gap-1">
          <a class="nav-link {% if request.endpoint == 'inicio' %}active{% endif %}"
             href="{{ url_for('inicio') }}">Inicio</a>
          {% for item in menu %}
          <a class="nav-link {% if request.blueprint == item.endpoint.split('.')[0] %}active{% endif %}"
             href="{{ url_for(item.endpoint) }}">{{ item.texto }}</a>
          {% endfor %}
        </nav>
      </aside>

      <main class="col-md-9 col-lg-10 p-4">
        {% with mensajes = get_flashed_messages(with_categories=true) %}
          {% for categoria, mensaje in mensajes %}
          <div class="alert alert-{{ 'info' if categoria == 'message' else categoria }}">{{ mensaje }}</div>
          {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
