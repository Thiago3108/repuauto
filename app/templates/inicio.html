{% extends "base.html" %}

{% block content %}
<h1 class="h3 mb-1">Hola, {{ current_user.nombre }}</h1>
<p class="text-muted">Estos son tus accesos como {{ current_user.rol.nombre }}.</p>

<div class="row g-3">
  {% for item in menu %}
  <div class="col-sm-6 col-lg-3">
    <a class="card h-100 text-decoration-none" href="{{ url_for(item.endpoint) }}">
      <div class="card-body">
        <h2 class="h6 card-title text-dark mb-1">{{ item.texto }}</h2>
        <p class="card-text small text-muted mb-0">{{ item.historia }}</p>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
